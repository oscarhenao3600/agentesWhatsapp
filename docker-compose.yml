x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ===================================================================
  # Base de Datos MongoDB
  # Compatible con Raspberry Pi 3B+ (ARMv8 Cortex-A53 / aarch64)
  # mongo:4.4.18 evita el error de 'Illegal instruction (core dumped)' de MongoDB 5+
  # ===================================================================
  mongodb:
    image: mongo:4.4.18
    container_name: agentes_whatsapp_db
    # Limita la memoria caché de WiredTiger a 150MB (0.15 GB) para proteger el 1GB de RAM de la Raspberry Pi
    command: mongod --wiredTigerCacheSizeGB 0.15
    ports:
      - "${MONGO_EXTERNAL_PORT:-48160}:27017"
    volumes:
      - agentes_whatsapp_mongodb_data:/data/db
    networks:
      - agentes_whatsapp_net
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M

  # ===================================================================
  # Backend (Node.js + Baileys WebSockets / Gemini AI)
  # ===================================================================
  backend:
    build:
      context: ./backend
    container_name: agentes_whatsapp_backend
    ports:
      - "${BACKEND_PORT:-4050}:${BACKEND_PORT:-4050}"
    environment:
      - PORT=${BACKEND_PORT:-4050}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/agentes_whatsapp}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NODE_ENV=${NODE_ENV:-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - DEFAULT_GATEWAY_TYPE=baileys
      - ALLOW_CHROMIUM=false
      - NODE_OPTIONS=--max-old-space-size=256
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
    volumes:
      # Persistencia de la sesión autenticada de WhatsApp (Baileys)
      - agentes_whatsapp_auth:/app/.wwebjs_auth
    depends_on:
      - mongodb
    networks:
      - agentes_whatsapp_net
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-4050}/ping >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    shm_size: '64mb'
    deploy:
      resources:
        limits:
          memory: 350M

  # ===================================================================
  # Frontend (React + Nginx)
  # ===================================================================
  frontend:
    build:
      context: ./frontend
    container_name: agentes_whatsapp_frontend
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      - backend
    networks:
      - agentes_whatsapp_net
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  agentes_whatsapp_mongodb_data:
  agentes_whatsapp_auth:

networks:
  agentes_whatsapp_net:
    name: agentes_whatsapp_net
    driver: bridge
